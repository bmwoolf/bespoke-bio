[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bespoke-bio"
version = "0.1.0"
description = "Variant-to-protein middle layer for Bespoke Bio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
vault = [
  "azure-identity>=1.23,<2",
  "azure-keyvault-secrets>=4.9,<5",
]
stage1 = [
  "biopython==1.86",
  "pysam==0.23.3",
  "pyyaml==6.0.3",
]
dev = [
  "biopython==1.86",
  "httpx>=0.28,<1",
  "pysam==0.23.3",
  "pytest>=8.3,<10",
  "pyyaml==6.0.3",
  "ruff>=0.11,<1",
]

[project.scripts]
bespoke-stage1 = "bespoke_bio.stage1.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bespoke_bio"]
artifacts = ["src/bespoke_bio/demo/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

