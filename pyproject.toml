[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bespoke-bio"
version = "0.1.0"
description = "Variant-to-protein middle layer for Bespoke Bio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
design = [
  "numpy==2.2.6",
  "gemmi==0.7.3",
  "pydantic==2.12.3",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
biocad = "biocad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bespoke_bio", "src/biocad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

